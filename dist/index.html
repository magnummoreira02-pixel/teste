<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACHD Material Control</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0B0F19;
      color: #E8F0EB;
      transition: background 180ms ease, color 180ms ease;
    }

    .app-shell {
      --surface: #1F2937;
      --surface-soft: #111827;
      --surface-raised: #1A221E;
      --app-bg: #0B0F19;
      --text: #E8F0EB;
      --muted: #94a3b8;
      --border: #1e293b;
      --border-strong: #334155;
      --accent: #22C55E;
      --accent-dark: #15803D;
      --accent-soft: rgba(34, 197, 94, 0.14);
      --accent-bg: rgba(34, 197, 94, 0.10);
      --warn: #EAB308;
      --warn-bg: rgba(234, 179, 8, 0.12);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --purple: #A78BFA;
      --purple-bg: rgba(167, 139, 250, 0.14);
      --blue: #60A5FA;
      --blue-bg: rgba(96, 165, 250, 0.14);
      --orange: #F59E0B;
      --orange-bg: rgba(245, 158, 11, 0.14);
      background: var(--app-bg) !important;
      color: var(--text) !important;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding: 32px 20px;
    }

    .app-shell .panel-surface {
      background: var(--surface) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .app-shell input,
    .app-shell select {
      background: var(--surface-soft) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      caret-color: var(--accent);
      border-radius: 8px;
    }

    .app-shell input::placeholder { color: var(--muted) !important; }

    .app-shell .muted-text { color: var(--muted) !important; }

    .app-shell input:focus,
    .app-shell select:focus {
      outline: none !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .app-shell button {
      border-radius: 12px !important;
      font-weight: 600;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        color 180ms ease,
        filter 180ms ease,
        transform 120ms ease,
        box-shadow 180ms ease,
        opacity 180ms ease;
    }

    .app-shell button:hover:not(:disabled) { filter: brightness(1.07); }
    .app-shell button:active:not(:disabled) { transform: translateY(1px); }
    .app-shell button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app-shell button:disabled { opacity: 0.45; cursor: not-allowed; }

    .agro-header {
      max-width: 1200px;
      margin: 0 auto 32px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      box-shadow: 0 10px 15px -3px var(--accent);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 12px 18px;
      color: var(--text);
      background: var(--surface-soft);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto 32px;
    }

    .metric-card {
      padding: 24px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      transition: transform 180ms ease;
    }

    .metric-card:hover { transform: translateY(-2px); }

    .panel-surface {
      border-radius: 16px !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .reader-frame {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 0 0 3px var(--accent-soft);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .reader-frame:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .located-card {
      animation: located-in 180ms ease-out;
      border: 1px solid var(--accent-soft);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .located-code {
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-soft);
    }

    @keyframes located-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .drop-zone {
      transition: border-color 180ms ease, background-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
    }

    .drop-zone:hover {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .history-counter {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px 12px 14px;
      border: 1px solid var(--accent-soft);
      border-radius: 999px;
      background: var(--accent-bg);
      color: var(--accent);
    }

    .history-counter-value {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    @media (max-width: 900px) {
      .agro-header { align-items: flex-start; flex-direction: column; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .app-shell { padding: 16px 12px !important; }
      .agro-header { margin-bottom: 20px; padding: 20px; }
      .brand-mark { min-width: 0; }
      .brand-mark > div:last-child { min-width: 0; }
      .brand-mark > div:last-child > div:first-child {
        font-size: clamp(16px, 4vw, 22px) !important;
        overflow-wrap: anywhere;
      }
      .metric-grid { gap: 16px; margin-bottom: 20px; }
      .metric-card { padding: 16px 20px; }
      .metric-card > div:last-child { font-size: 20px !important; }

      .panel-actions { width: 100%; justify-content: stretch; }
      .panel-actions > * { flex: 1 1 140px; }
      .panel-actions button { width: 100%; }

      .history-table-wrap { display: none; }
      .history-cards { display: grid; gap: 12px; }
      .history-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px 16px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface-soft);
      }
      .history-card-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .history-card-value { overflow-wrap: anywhere; }
      .history-card-code { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

      .items-table-wrap { overflow-x: visible; }
      .items-table-wrap table { min-width: 0 !important; }
      .items-table-wrap thead { display: none; }
      .items-table-wrap tbody,
      .items-table-wrap tr,
      .items-table-wrap td { display: block; width: 100%; }
      .items-table-wrap tr {
        margin-bottom: 12px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .items-table-wrap td {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 0 !important;
        border-bottom: 1px solid var(--border) !important;
        white-space: normal !important;
        overflow-wrap: anywhere;
      }
      .items-table-wrap td:last-child { border-bottom: 0 !important; }

      .reader-frame input { min-width: 0; font-size: clamp(16px, 5vw, 20px) !important; }
      .reader-actions { display: grid !important; grid-template-columns: 1fr !important; }
      .reader-actions button { width: 100%; min-height: 52px; }
      .located-code { overflow-wrap: anywhere; }
      .box-card-actions { display: grid !important; grid-template-columns: 1fr 1fr !important; }
    }

    @media (max-width: 380px) {
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .metric-card > div:first-child { font-size: 9px !important; letter-spacing: .04em !important; }
      .theme-toggle { width: 100%; justify-content: center; }
    }

    @media (min-width: 760px) {
      .app-shell {
        padding: clamp(24px, 4vw, 48px) clamp(20px, 4vw, 56px) !important;
      }

      .desktop-main-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 24px;
        align-items: start;
      }

      .desktop-main-grid > .panel-full {
        grid-column: 1 / -1;
      }
    }

    @media (min-width: 1200px) {
      .desktop-main-grid { grid-template-columns: minmax(0, 1fr) minmax(390px, .85fr); }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-DdGhSNES.js"></script>
</head>

<body>
  <div id="root"></div>
</body>
</html>
