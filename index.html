<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seleção de Material</title>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel para permitir JSX diretamente no HTML -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Biblioteca para leitura de Excel/CSV -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family:
        'IBM Plex Sans',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      background: #F1F1EC;
    }

    body {
      transition: background 180ms ease, color 180ms ease;
    }

    .app-shell {
      --surface: #FFFFFF;
      --surface-soft: #F8FAF8;
      --app-bg: #F5F7F5;
      --text: #172117;
      --muted: #667085;
      --border: #DDE3DD;
      --accent: #2E7D32;
      --accent-dark: #1B5E20;
      --accent-soft: #E8F5E9;
      background: var(--app-bg) !important;
      color: var(--text) !important;
      min-height: 100vh;
    }

    .app-shell.dark {
      --surface: #121814;
      --surface-soft: #182019;
      --app-bg: #0B0F0C;
      --text: #F1F5F2;
      --muted: #98A69B;
      --border: #26352A;
      --accent: #4CAF50;
      --accent-dark: #1B5E20;
      --accent-soft: #1B2C1E;
    }

    .app-shell .panel-surface {
      background: var(--surface) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }

    .app-shell .panel-surface > div,
    .app-shell table,
    .app-shell select {
      color: var(--text) !important;
    }

    .app-shell input,
    .app-shell select {
      background: var(--surface-soft) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .app-shell .muted-text { color: var(--muted) !important; }

    .agro-header {
      max-width: 1200px;
      margin: 0 auto 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #FFFFFF;
      background: var(--accent-dark);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 11px;
      color: var(--text);
      background: var(--surface-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto 20px;
    }

    .metric-card {
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
    }

    .reader-frame {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .reader-frame:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .located-card {
      animation: located-in 180ms ease-out;
      box-shadow: 0 8px 24px rgba(27, 94, 32, 0.12);
    }

    .located-code {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-soft);
    }

    @keyframes located-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .agro-header { align-items: flex-start; flex-direction: column; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      user-select: none;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    /* =========================================================
       REACT
    ========================================================= */

    const {
      useState,
      useMemo,
      useRef,
      useCallback,
      useEffect
    } = React;


    /* =========================================================
       ÍCONES
       Criados diretamente em SVG para evitar o erro React #130
    ========================================================= */

    const Icon = ({
      name,
      size = 18,
      color = "currentColor",
      strokeWidth = 2,
      style = {}
    }) => {

      const common = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: color,
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        style: {
          display: "inline-block",
          flexShrink: 0,
          ...style
        }
      };

      const icons = {

        UploadCloud: (
          <svg {...common}>
            <path d="M16 16l-4-4-4 4" />
            <path d="M12 12v9" />
            <path d="M20.39 17.39A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.3" />
          </svg>
        ),

        FileSpreadsheet: (
          <svg {...common}>
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18" />
            <path d="M9 3v18" />
            <path d="M15 9v12" />
            <path d="M9 15h6" />
          </svg>
        ),

        Settings2: (
          <svg {...common}>
            <path d="M20 7h-9" />
            <path d="M14 17H5" />
            <circle cx="17" cy="7" r="3" />
            <circle cx="7" cy="17" r="3" />
          </svg>
        ),

        Search: (
          <svg {...common}>
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        ),

        X: (
          <svg {...common}>
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        ),

        Check: (
          <svg {...common}>
            <path d="m5 12 4 4L19 6" />
          </svg>
        ),

        RotateCcw: (
          <svg {...common}>
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        ),

        AlertTriangle: (
          <svg {...common}>
            <path d="m21 21-1.8-3.2" />
            <path d="M5 17.8 3 21" />
            <path d="M3.3 16.5 12 3l8.7 13.5a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3Z" />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          </svg>
        ),

        Printer: (
          <svg {...common}>
            <path d="M6 9V2h12v7" />
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <path d="M6 14h12v8H6z" />
          </svg>
        ),

        Sun: (
          <svg {...common}>
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        ),

        Moon: (
          <svg {...common}>
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" />
          </svg>
        ),

        Activity: (
          <svg {...common}>
            <path d="M3 12h4l2-7 4 14 2-7h6" />
          </svg>
        )
      };

      return icons[name] || null;
    };


    /* =========================================================
       CORES
    ========================================================= */

    const PAPER = "#F1F1EC";
    const PANEL = "#FFFFFF";

    const INK = "#1E2A38";
    const INK_SOFT = "#5B6B7C";

    const LINE = "#D8D9D0";
    const LINE_STRONG = "#B7BAAF";

    const AMBER = "#C97A1C";
    const AMBER_BG = "#FBEEDD";

    const GREEN = "#2E7D5B";
    const GREEN_BG = "#E4F2EA";

    const RED = "#B3402E";
    const RED_BG = "#FBEAE6";

    const PURPLE = "#7A3E9D";
    const PURPLE_BG = "#F0E6F5";
    const BLUE = "#2468A8";
    const BLUE_BG = "#E5F0FA";
    const ORANGE = "#C96A16";
    const ORANGE_BG = "#FCE8D2";
    const HISTORY_STORAGE_KEY = "selecao-material-historico-v1";


    /* =========================================================
       FONTES
    ========================================================= */

    const FONT_IMPORT = `
      @import url(
        'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700
        &family=IBM+Plex+Sans:wght@400;500;600
        &family=IBM+Plex+Mono:wght@400;500;600
        &display=swap'
      );
    `;


    /* =========================================================
       IDENTIFICAÇÃO AUTOMÁTICA DA COLUNA
    ========================================================= */

    function guessIdColumn(headers) {

      const patterns = [
        "qr",
        "codigo",
        "código",
        "cod",
        "id",
        "sku",
        "material",
        "tag"
      ];

      for (const p of patterns) {

        const found = headers.find((h) =>
          String(h).toLowerCase().includes(p)
        );

        if (found) {
          return found;
        }
      }

      return headers[0] || "";
    }

    function normalizeValue(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    function getAvancoStatus(row) {
      const column = Object.keys(row).find(
        (key) => ["avanco", "avanço"].includes(normalizeValue(key))
      );
      const value = normalizeValue(column ? row[column] : "");

      if (["sim", "yes", "s", "true"].includes(value)) return "sim";
      if (["nao", "não", "no", "n", "false"].includes(value)) return "nao";
      return "";
    }

    function getManualHighlightColor(row, highlightRule) {
      if (!highlightRule?.column || !highlightRule.value.trim()) return "";
      return normalizeValue(row[highlightRule.column]) === normalizeValue(highlightRule.value)
        ? highlightRule.color
        : "";
    }

    function getRowColor(sheetName, row, colorRules, highlightRule) {
      const manualColor = getManualHighlightColor(row, highlightRule);
      if (manualColor) return manualColor;
      const name = normalizeValue(sheetName);

      const traitColumn = Object.keys(row).find(
        (key) => normalizeValue(key) === "trait"
      );
      const traitValue = normalizeValue(traitColumn ? row[traitColumn] : "");
      const avancoStatus = getAvancoStatus(row);

      const getTraitColor = () => {
        if (traitValue === "ce3") return colorRules.trait.ce3;
        if (traitValue === "e3") return colorRules.trait.e3;
        if (traitValue === "i5+") return colorRules.trait.i5;
        if (traitValue === "gmb") return colorRules.trait.gmb;
        if (traitValue === "con") return colorRules.trait.con;
        return "";
      };

      const getAvancoColor = () => {
        if (avancoStatus === "sim") {
          return colorRules.avanco.sim;
        }
        if (avancoStatus === "nao") {
          return colorRules.avanco.nao;
        }
        return "";
      };

      if (name.includes("avanco") || name.includes("avanço")) {
        return getAvancoColor();
      }
      if (name.includes("trait")) {
        return getTraitColor();
      }

      return getTraitColor() || getAvancoColor();
    }


    /* =========================================================
       BADGE DOS PASSOS
    ========================================================= */

    function StepBadge({ n, active }) {

      return (
        <div
          style={{
            width: 30,
            height: 30,
            borderRadius: 4,

            border:
              `1.5px solid ${
                active ? INK : LINE_STRONG
              }`,

            color:
              active ? PAPER : INK_SOFT,

            background:
              active ? INK : "transparent",

            display: "flex",
            alignItems: "center",
            justifyContent: "center",

            fontFamily:
              "'IBM Plex Mono', monospace",

            fontWeight: 600,
            fontSize: 13,

            flexShrink: 0
          }}
        >
          {n}
        </div>
      );
    }


    /* =========================================================
       PAINEL
    ========================================================= */

    function Panel({
      step,
      title,
      active,
      children,
      trailing
    }) {

      return (
        <section
          className="panel-surface"
          style={{
            background: PANEL,

            border:
              `1px solid ${LINE}`,

            borderRadius: 6,

            marginBottom: 20,

            opacity:
              active ? 1 : 0.55,

            transition:
              "opacity 0.2s ease"
          }}
        >

          <div
            style={{
              display: "flex",
              alignItems: "center",
              gap: 12,

              padding:
                "14px 18px",

              borderBottom:
                `1px solid ${LINE}`
            }}
          >

            <StepBadge
              n={step}
              active={active}
            />

            <span
              style={{
                fontFamily:
                  "'Space Grotesk', sans-serif",

                fontWeight: 600,
                fontSize: 14,

                letterSpacing:
                  "0.03em",

                textTransform:
                  "uppercase",

                color: INK,

                flex: 1
              }}
            >
              {title}
            </span>

            {trailing}

          </div>

          <div
            style={{
              padding: 18
            }}
          >
            {children}
          </div>

        </section>
      );
    }

    function ColorOption({ label, value, onChange }) {
      return (
        <label
          style={{
            display: "flex",
            alignItems: "center",
            gap: 8,
            fontSize: 12.5,
            color: INK_SOFT
          }}
        >
          <input
            type="color"
            value={value}
            onChange={(e) => onChange(e.target.value)}
            style={{ width: 28, height: 24, padding: 0, border: 0, cursor: "pointer" }}
          />
          {label}
        </label>
      );
    }


    /* =========================================================
       APLICAÇÃO
    ========================================================= */

    function App() {

      const [fileName, setFileName] =
        useState("");

      const [headers, setHeaders] =
        useState([]);

      const [rows, setRows] =
        useState([]);

      const [sheets, setSheets] =
        useState([]);

      const [selectedSheets, setSelectedSheets] =
        useState([]);

      const [idColumn, setIdColumn] =
        useState("");

      const [displayColumns, setDisplayColumns] =
        useState([]);

      const [highlightedFields, setHighlightedFields] =
        useState(["Trait", "Avanco", "Avanço"]);

      const [highlightedFieldsColor, setHighlightedFieldsColor] =
        useState("#FFF1B8");

      const [query, setQuery] =
        useState("");

      const [matched, setMatched] =
        useState(null);

      const [searchState, setSearchState] =
        useState("idle");

      const [dragOver, setDragOver] =
        useState(false);

      const [parseError, setParseError] =
        useState("");

      const [theme, setTheme] =
        useState(() => localStorage.getItem("agro-material-theme") || "light");

      const [history, setHistory] =
        useState([]);

      const [lastProcessedCode, setLastProcessedCode] =
        useState("");

      const [colorRules, setColorRules] =
        useState({
          avanco: {
            sim: GREEN_BG,
            nao: RED_BG
          },
          trait: {
            ce3: PURPLE_BG,
            e3: GREEN_BG,
            i5: BLUE_BG,
            gmb: RED_BG,
            con: ORANGE_BG
          },
          manual: {
            color: "#FFF1B8"
          }
        });

      const [highlightRule, setHighlightRule] =
        useState({ column: "", value: "", color: "#FFF1B8" });

      const inputRef =
        useRef(null);

      const searchInputRef =
        useRef(null);

      useEffect(() => {
        loadHistory();
      }, []);

      useEffect(() => {
        localStorage.setItem("agro-material-theme", theme);
      }, [theme]);

      /* =====================================================
         ESTADOS DERIVADOS
      ===================================================== */

      const hasData =
        rows.length > 0 &&
        headers.length > 0;

      const selectedRows =
        useMemo(
          () => rows.filter((row) => selectedSheets.includes(row.__sheetName)),
          [rows, selectedSheets]
        );

      const readyToSearch =
        hasData &&
        idColumn &&
        selectedRows.length > 0;

      useEffect(() => {
        if (readyToSearch && searchInputRef.current) {
          searchInputRef.current.focus();
        }
      }, [readyToSearch]);

      const matchedRowColor =
        matched
          ? getRowColor(matched.__sheetName, matched, colorRules)
          : "";

      const matchedAvancoStatus =
        matched ? getAvancoStatus(matched) : "";

      const matchedAvancoColor =
        matchedAvancoStatus === "sim"
          ? colorRules.avanco.sim
          : matchedAvancoStatus === "nao"
            ? colorRules.avanco.nao
            : "";

      const matchedAvancoTextColor =
        matchedAvancoStatus === "sim" ? GREEN : RED;

      const matchedAvancoValue =
        matched
          ? Object.entries(matched).find(
              ([key]) => ["avanco", "avanço"].includes(normalizeValue(key))
            )?.[1]
          : "";

      const foundMaterialsCount =
        history.filter((item) => item.status === "ENCONTRADO").length;

      const notFoundMaterialsCount =
        history.filter((item) => item.status === "NÃO ENCONTRADO").length;

      const latestReading = history[0];


      /* =====================================================
         PROCESSAR PLANILHA
      ===================================================== */

      const processFile =
        useCallback((file) => {

          if (!file) {
            return;
          }

          setParseError("");

          const reader =
            new FileReader();

          reader.onload =
            (e) => {

              try {

                const data =
                  new Uint8Array(
                    e.target.result
                  );

                const workbook =
                  XLSX.read(
                    data,
                    {
                      type: "array",
                      dense: true,
                      cellFormula: false
                    }
                  );

                if (
                  !workbook.SheetNames ||
                  workbook.SheetNames.length === 0
                ) {

                  setParseError(
                    "Não foi encontrada nenhuma planilha no arquivo."
                  );

                  return;
                }

                const parsedSheets = workbook.SheetNames
                  .map((sheetName) => {
                    const sheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(sheet, {
                      defval: "",
                      raw: false
                    });
                    return { name: sheetName, rows: json };
                  })
                  .filter((sheet) => sheet.rows.length > 0);

                if (!parsedSheets.length) {

                  setParseError(
                    "A planilha está vazia ou não foi possível ler as colunas."
                  );

                  return;
                }

                const hdrs = Array.from(new Set(
                  parsedSheets.flatMap((sheet) => Object.keys(sheet.rows[0]))
                ));

                if (!hdrs.length) {

                  setParseError(
                    "Não foram encontradas colunas na planilha."
                  );

                  return;
                }

                const allRows = parsedSheets.flatMap((sheet) =>
                  sheet.rows.map((row) => ({ ...row, __sheetName: sheet.name }))
                );

                setSheets(parsedSheets);
                setSelectedSheets(parsedSheets.map((sheet) => sheet.name));
                setHeaders(hdrs);
                setRows(allRows);
                setFileName(file.name);

                const guessed =
                  guessIdColumn(hdrs);

                setIdColumn(guessed);

                setDisplayColumns(
                  hdrs.filter(
                    (h) => h !== guessed
                  )
                );

                setQuery("");
                setMatched(null);
                setSearchState("idle");

              } catch (err) {

                console.error(err);

                setParseError(
                  "Não foi possível ler este arquivo. Confirme se é um .xlsx, .xls ou .csv válido."
                );
              }
            };

          reader.readAsArrayBuffer(file);

        }, []);


      /* =====================================================
         INPUT DE ARQUIVO
      ===================================================== */

      const handleFileInput =
        (e) => {

          const file =
            e.target.files &&
            e.target.files[0];

          if (file) {
            processFile(file);
          }
        };


      /* =====================================================
         ARRASTAR ARQUIVO
      ===================================================== */

      const handleDrop =
        (e) => {

          e.preventDefault();

          setDragOver(false);

          const file =
            e.dataTransfer.files &&
            e.dataTransfer.files[0];

          if (file) {
            processFile(file);
          }
        };


      /* =====================================================
         RESET
      ===================================================== */

      const resetAll =
        () => {

          setFileName("");
          setHeaders([]);
          setRows([]);
          setSheets([]);
          setSelectedSheets([]);
          setIdColumn("");
          setDisplayColumns([]);
          setQuery("");
          setMatched(null);
          setSearchState("idle");
          setParseError("");

          if (inputRef.current) {
            inputRef.current.value = "";
          }
        };


      /* =====================================================
         SUGESTÕES
      ===================================================== */

      const suggestions =
        useMemo(() => {

          if (
            !readyToSearch ||
            !query.trim()
          ) {
            return [];
          }

          const q =
            query
              .trim()
              .toLowerCase();

          return selectedRows
            .filter((r) =>
              String(
                r[idColumn] ?? ""
              )
              .toLowerCase()
              .includes(q)
            )
            .slice(0, 8);

        }, [
          selectedRows,
          idColumn,
          query,
          readyToSearch
        ]);


      /* =====================================================
         PESQUISA
      ===================================================== */

      const runSearch =
        (value) => {

          const q =
            String(
              value ?? query
            )
            .trim()
            .toLowerCase();

          if (!q) {

            setMatched(null);
            setSearchState("idle");

            return;
          }

          const exact =
            selectedRows.find(
              (r) =>
                String(
                  r[idColumn] ?? ""
                )
                .trim()
                .toLowerCase() === q
            );

          if (exact) {

            setMatched(exact);
            setSearchState("found");

          } else {

            setMatched(null);
            setSearchState("notfound");
          }
        };

      const loadHistory =
        () => {
          try {
            const savedHistory = JSON.parse(
              localStorage.getItem(HISTORY_STORAGE_KEY) || "[]"
            );
            const normalizedHistory = Array.isArray(savedHistory)
              ? savedHistory.filter((item) => item && item.number)
              : [];
            setHistory(normalizedHistory);
            return normalizedHistory;
          } catch (error) {
            console.warn("Não foi possível carregar o histórico.", error);
            return [];
          }
        };

      const addToHistory =
        (code, exact, date, time) => {
          const rowData = exact
            ? headers.reduce((data, header) => ({
                ...data,
                [header]: exact[header] ?? ""
              }), {})
            : {};
          const status = exact ? "ENCONTRADO" : "NÃO ENCONTRADO";

          setHistory((previousHistory) => {
            const nextNumber = previousHistory.reduce(
              (highest, item) => Math.max(highest, Number(item.number) || 0),
              0
            ) + 1;
            const record = {
              number: nextNumber,
              date,
              time,
              code,
              status,
              sheetName: exact?.__sheetName || "",
              rowData
            };
            const nextHistory = [record, ...previousHistory];
            localStorage.setItem(
              HISTORY_STORAGE_KEY,
              JSON.stringify(nextHistory)
            );
            return nextHistory;
          });
        };

      const processQRCode =
        (value) => {
          const code = String(value ?? "").trim();
          if (!code || !readyToSearch) {
            if (searchInputRef.current) searchInputRef.current.focus();
            return;
          }

          const exact = selectedRows.find(
            (row) => normalizeValue(row[idColumn]) === normalizeValue(code)
          );
          const now = new Date();
          const date = now.toLocaleDateString("pt-BR");
          const time = now.toLocaleTimeString("pt-BR", { hour12: false });

          setLastProcessedCode(code);
          setQuery("");
          if (exact) {
            setMatched(exact);
            setSearchState("found");
          } else {
            setMatched(null);
            setSearchState("notfound");
          }
          addToHistory(code, exact, date, time);

          requestAnimationFrame(() => {
            if (searchInputRef.current) searchInputRef.current.focus();
          });
        };

        () => {
          if (!history.length) return;
          if (window.confirm("Deseja realmente limpar todo o histórico de leituras?")) {

            setHistory([]);

              "Data": item.date,
              "Hora": item.time,
              "QR Code": item.code,
              "Status": item.status,
              ...headers.reduce((data, header) => ({
                ...data,
                [header]: item.rowData?.[header] ?? "-"
              }), {})
            }));

          const workbook = XLSX.utils.book_new();

          XLSX.writeFile(workbook, "Historico_Leituras.xlsx");

         ALTERAR COLUNAS

                        placeholder={
                          `Digite ou leia o código (${idColumn})`
                        }

                        style={{
                          flex: 1,

                          border: "none",

                          outline: "none",

                          background:
                            "transparent",

                          fontFamily:
                            "'IBM Plex Mono', monospace",

                          fontSize: 20,
                          fontWeight: 600,

                          padding:
                            "10px 0",

                          color: INK
                        }}

                        autoFocus
                      />


                      {query && (

                        <button
                          onClick={() => {

                            setQuery("");

                            setMatched(null);

                            setSearchState(
                              "idle"
                            );
                          }}

                          style={{
                            background:
                              "transparent",

                            border: "none",

                            cursor:
                              "pointer",

                            color:
                              INK_SOFT,

                            display:
                              "flex"
                          }}

                          aria-label=
                            "Limpar busca"
                        >

                          <Icon
                            name="X"
                            size={16}
                          />

                        </button>
                      )}

                    </div>

                  </div>


                  {/* SUGESTÕES */}

                  {query &&
                    suggestions.length > 0 &&
                    searchState === "idle" && (

                      <div
                        style={{
                          border:
                            `1px solid ${LINE}`,

                          borderRadius: 4,

                          marginTop: 6,

                          overflow:
                            "hidden"
                        }}
                      >

                        {suggestions.map(
                          (r, i) => (

                            <div
                              key={i}

                              onClick={() => {

                                const value =
                                  String(
                                    r[idColumn]
                                  );

                                setQuery(value);

                                runSearch(
                                  value
                                );
                              }}

                              style={{
                                padding:
                                  "9px 12px",

                                fontSize: 13,

                                fontFamily:
                                  "'IBM Plex Mono', monospace",

                                cursor:
                                  "pointer",

                                borderBottom:
                                  i <
                                  suggestions.length - 1
                                    ? `1px solid ${LINE}`
                                    : "none",

                                display:
                                  "flex",

                                justifyContent:
                                  "space-between",

                                gap: 15
                              }}

                              onMouseEnter={
                                (e) =>
                                  e.currentTarget.style.background =
                                    PAPER
                              }

                              onMouseLeave={
                                (e) =>
                                  e.currentTarget.style.background =
                                    "transparent"
                              }
                            >

                              <span
                                style={{
                                  fontWeight: 600
                                }}
                              >
                                {
                                  String(
                                    r[idColumn]
                                  )
                                }
                              </span>


                              {displayColumns[0] && (

                                <span
                                  style={{
                                    color:
                                      INK_SOFT,

                                    fontFamily:
                                      "'IBM Plex Sans', sans-serif",

                                    overflow:
                                      "hidden",

                                    textOverflow:
                                      "ellipsis",

                                    whiteSpace:
                                      "nowrap"
                                  }}
                                >
                                  {
                                    String(
                                      r[
                                        displayColumns[0]
                                      ] ?? ""
                                    )
                                  }
                                </span>

                              )}

                            </div>

                          )
                        )}

                      </div>
                  )}


                  {/* NÃO ENCONTRADO */}

                  {searchState ===
                    "notfound" && (

                    <div
                      style={{
                        marginTop: 14,

                        display:
                          "flex",

                        alignItems:
                          "center",

                        gap: 8,

                        background:
                          RED_BG,

                        color: RED,

                        border:
                          `1px solid ${RED}`,

                        borderRadius: 4,

                        padding:
                          "10px 12px",

                        fontSize: 13
                      }}
                    >

                      <Icon
                        name="AlertTriangle"
                        size={15}
                        color={RED}
                      />

                      <span>
                        Nenhum item encontrado
                        para "{lastProcessedCode || query}" em
                        {" "}
                        {idColumn}.
                      </span>

                    </div>
                  )}


                  {/* ENCONTRADO */}

                  {searchState ===
                    "found" &&
                    matched && (

                    <div
                      className="located-card"
                      style={{
                        marginTop: 16,

                        background:
                          matchedRowColor || GREEN_BG,

                        border:
                          `1px dashed ${matchedRowColor || GREEN}`,

                        borderRadius: 6,

                        padding:
                          "16px 18px"
                      }}
                    >

                      <div
                        style={{
                          display:
                            "flex",

                          alignItems:
                            "center",

                          gap: 8,

                          color: GREEN,

                          fontWeight: 600,

                          fontSize: 14,

                          textTransform:
                            "uppercase",

                          letterSpacing:
                            "0.04em",

                          marginBottom: 10
                        }}
                      >

                        <Icon
                          name="Check"
                          size={15}
                          color={GREEN}
                        />

                        MATERIAL ENCONTRADO

                      </div>


                      {matchedAvancoStatus && (
                        <div
                          style={{
                            margin: "14px 0 16px",
                            padding: "14px 16px",
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "space-between",
                            gap: 16,
                            background: matchedAvancoColor,
                            border: `2px solid ${matchedAvancoTextColor}`,
                            borderRadius: 6,
                            color: matchedAvancoTextColor
                          }}
                        >
                          <div>
                            <div
                              style={{
                                fontSize: 11,
                                fontWeight: 700,
                                letterSpacing: "0.12em",
                                textTransform: "uppercase",
                                marginBottom: 4
                              }}
                            >
                              Avanço
                            </div>
                            <div
                              style={{
                                fontFamily: "'Space Grotesk', sans-serif",
                                fontSize: 25,
                                fontWeight: 700,
                                lineHeight: 1
                              }}
                            >
                              {String(matchedAvancoValue)}
                            </div>
                          </div>
                          <Icon
                            name="Check"
                            size={30}
                            color={matchedAvancoTextColor}
                            strokeWidth={3}
                          />
                        </div>
                      )}


                      <div className="located-code"
                        style={{
                          fontFamily:
                            "'IBM Plex Mono', monospace",

                          fontSize: 20,

                          fontWeight: 600,

                          color: INK,

                          marginBottom: 10
                        }}
                      >
                        <div style={{ color: INK_SOFT, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 11, fontWeight: 700, letterSpacing: "0.12em", marginBottom: 4 }}>
                          QR CODE
                        </div>
                        {
                          String(
                            matched[idColumn]
                          )
                        }
                      </div>


                      <div
                        style={{
                          display:
                            "flex",

                          flexDirection:
                            "column",

                          gap: 6
                        }}
                      >

                        {displayColumns.map(
                          (h) => {
                            const isHighlighted = highlightedFields.includes(h);

                            return (

                            <div
                              key={h}

                              style={{
                                display:
                                  "flex",

                                justifyContent:
                                  "space-between",

                                gap: 20,

                                fontSize: 13.5,

                                borderTop:
                                  `1px solid ${LINE}`,

                                background: isHighlighted ? highlightedFieldsColor : "transparent",
                                borderRadius: isHighlighted ? 4 : 0,
                                padding: isHighlighted ? "8px 10px" : "6px 0",

                                paddingTop: isHighlighted ? 8 : 6
                              }}
                            >

                              <span
                                style={{
                                  color:
                                    isHighlighted ? INK : INK_SOFT,
                                  fontWeight: isHighlighted ? 700 : 400
                                }}
                              >
                                {h}
                              </span>

                              <span
                                style={{
                                  fontWeight: 500,

                                  color: isHighlighted ? INK : "inherit",

                                  textAlign:
                                    "right"
                                }}
                              >
                                {
                                  String(
                                    matched[h] ??
                                    "—"
                                  )
                                }
                              </span>

                            </div>

                            );
                          }
                        )}

                      </div>

                    </div>
                  )}

                </div>
              )}

            </Panel>


            {/* =================================================
                HISTÓRICO DE LEITURAS
            ================================================= */}

            <Panel
              step={4}
              title="Histórico de leituras"
              active={true}
              trailing={
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <div
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 7,
                      padding: "6px 10px",
                      borderRadius: 4,
                      border: `1px solid ${GREEN}`,
                      background: GREEN_BG,
                      color: GREEN,
                      fontSize: 12,
                      fontWeight: 700,
                      whiteSpace: "nowrap"
                    }}
                  >
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 16 }}>
                      {foundMaterialsCount}
                    </span>
                    materiais encontrados
                  </div>
                  <button
                    onClick={exportHistory}
                    disabled={!history.length}
                    style={{
                      border: `1px solid ${history.length ? INK : LINE_STRONG}`,
                      borderRadius: 4,
                      padding: "6px 10px",
                      background: history.length ? INK : "transparent",
                      color: history.length ? PAPER : INK_SOFT,
                      cursor: history.length ? "pointer" : "not-allowed",
                      fontSize: 12
                    }}
                  >
                    EXPORTAR HISTÓRICO
                  </button>
                  <button
                    onClick={clearHistory}
                    disabled={!history.length}
                    style={{
                      border: `1px solid ${history.length ? RED : LINE_STRONG}`,
                      borderRadius: 4,
                      padding: "6px 10px",
                      background: "transparent",
                      color: history.length ? RED : INK_SOFT,
                      cursor: history.length ? "pointer" : "not-allowed",
                      fontSize: 12
                    }}
                  >
                    Limpar histórico
                  </button>
                </div>
              }
            >
              {!history.length ? (
                <div style={{ fontSize: 13, color: INK_SOFT }}>
                  Os QR Codes bipados aparecerão aqui.
                </div>
              ) : (
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
                    <thead>
                      <tr>
                        {["Nº", "Data", "Hora", "QR Code", "Status", ...displayColumns.slice(0, 2)].map((header) => (
                          <th
                            key={header}
                            style={{
                              textAlign: "left",
                              padding: "8px 10px",
                              borderBottom: `2px solid ${INK}`,
                              color: INK,
                              whiteSpace: "nowrap"
                            }}
                          >
                            {header}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {history.slice(0, 10).map((item) => (
                        <tr key={`${item.number}-${item.date}-${item.time}`}>
                          <td style={{ padding: "7px 10px", borderBottom: `1px solid ${LINE}`, fontFamily: "'IBM Plex Mono', monospace" }}>{item.number}</td>
                          <td style={{ padding: "7px 10px", borderBottom: `1px solid ${LINE}`, whiteSpace: "nowrap" }}>{item.date}</td>
                          <td style={{ padding: "7px 10px", borderBottom: `1px solid ${LINE}`, whiteSpace: "nowrap" }}>{item.time}</td>
                          <td style={{ padding: "7px 10px", borderBottom: `1px solid ${LINE}`, fontFamily: "'IBM Plex Mono', monospace", whiteSpace: "nowrap" }}>{item.code}</td>
                          <td
                            style={{
                              padding: "7px 10px",
                              borderBottom: `1px solid ${LINE}`,
                              color: item.status === "ENCONTRADO" ? GREEN : RED,
                              fontWeight: 700,
                              whiteSpace: "nowrap"
                            }}
                          >
                            {item.status}
                          </td>
                          {displayColumns.slice(0, 2).map((header) => (
                            <td key={header} style={{ padding: "7px 10px", borderBottom: `1px solid ${LINE}`, whiteSpace: "nowrap" }}>
                              {item.rowData?.[header] || "-"}
                            </td>
                          ))}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Panel>


            {/* =================================================
                TABELA
            ================================================= */}

            {hasData && (

              <Panel
                step={5}
                title={
                  `Itens selecionados (${selectedRows.length})`
                }
                active={true}
              >

                <div
                  style={{
                    overflowX:
                      "auto"
                  }}
                >

                  <table
                    style={{
                      width: "100%",

                      borderCollapse:
                        "collapse",

                      fontSize: 12.5
                    }}
                  >

                    <thead>

                      <tr>

                        <th
                          style={{
                            textAlign:
                              "left",

                            padding:
                              "8px 10px",

                            borderBottom:
                              `2px solid ${INK}`,

                            color: INK,

                            fontFamily:
                              "'IBM Plex Mono', monospace",

                            whiteSpace:
                              "nowrap"
                          }}
                        >
                          {idColumn}
                        </th>

                        <th
                          style={{
                            textAlign: "left",
                            padding: "8px 10px",
                            borderBottom: `2px solid ${INK}`,
                            color: INK_SOFT,
                            fontWeight: 500,
                            whiteSpace: "nowrap"
                          }}
                        >
                          Aba
                        </th>


                        {displayColumns.map(
                          (h) => (

                            <th
                              key={h}

                              style={{
                                textAlign:
                                  "left",

                                padding:
                                  "8px 10px",

                                borderBottom:
                                  `2px solid ${INK}`,

                                color:
                                  INK_SOFT,

                                fontWeight:
                                  500,

                                whiteSpace:
                                  "nowrap"
                              }}
                            >
                              {h}
                            </th>

                          )
                        )}

                      </tr>

                    </thead>


                    <tbody>

                      {selectedRows.map(
                        (r, i) => {

                          const isMatch =
                            matched &&
                            String(
                              r[idColumn]
                            ) ===
                            String(
                              matched[idColumn]
                            );

                          const rowColor = getRowColor(r.__sheetName, r, colorRules, highlightRule);

                          return (

                            <tr
                              key={i}

                              style={{
                                background:
                                  rowColor ||
                                  (isMatch
                                    ? AMBER_BG
                                    : i % 2 === 0
                                      ? PANEL
                                      : PAPER)
                              }}
                            >

                              <td
                                style={{
                                  padding:
                                    "7px 10px",

                                  borderBottom:
                                    `1px solid ${LINE}`,

                                  fontFamily:
                                    "'IBM Plex Mono', monospace",

                                  fontWeight:
                                    isMatch
                                      ? 600
                                      : 400,

                                  whiteSpace:
                                    "nowrap"
                                }}
                              >
                                {
                                  String(
                                    r[idColumn]
                                  )
                                }
                              </td>

                              <td
                                style={{
                                  padding: "7px 10px",
                                  borderBottom: `1px solid ${LINE}`,
                                  color: INK_SOFT,
                                  whiteSpace: "nowrap"
                                }}
                              >
                                {r.__sheetName}
                              </td>


                              {displayColumns.map(
                                (h) => (

                                  <td
                                    key={h}

                                    style={{
                                      padding:
                                        "7px 10px",

                                      borderBottom:
                                        `1px solid ${LINE}`,

                                      color: INK,

                                      whiteSpace:
                                        "nowrap"
                                    }}
                                  >
                                    {
                                      String(
                                        r[h] ?? ""
                                      )
                                    }
                                  </td>

                                )
                              )}

                            </tr>

                          );
                        }
                      )}

                    </tbody>

                  </table>

                </div>

              </Panel>
            )}

          </div>

        </div>
      );
    }


    /* =========================================================
       INICIAR REACT
    ========================================================= */

    const root =
      ReactDOM.createRoot(
        document.getElementById("root")
      );

    root.render(
      <App />
    );

  </script>

</body>
</html>
