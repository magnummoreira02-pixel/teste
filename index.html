<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seleção de Material</title>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel para permitir JSX diretamente no HTML -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Biblioteca para leitura de Excel/CSV -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      overflow-x: hidden;
    }

    body {
      font-family:
        'IBM Plex Sans',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;
      background: #F1F1EC;
    }

    body {
      transition: background 180ms ease, color 180ms ease;
    }

    .app-shell {
      --surface: #FFFFFF;
      --surface-soft: #F8FAF8;
      --app-bg: #F5F7F5;
      --text: #172117;
      --muted: #667085;
      --border: #DDE3DD;
      --accent: #2E7D32;
      --accent-dark: #1B5E20;
      --accent-soft: #E8F5E9;
      background: var(--app-bg) !important;
      color: var(--text) !important;
      min-height: 100vh;
    }

    .app-shell.dark {
      --surface: #121814;
      --surface-soft: #182019;
      --app-bg: #0B0F0C;
      --text: #F1F5F2;
      --muted: #98A69B;
      --border: #26352A;
      --accent: #4CAF50;
      --accent-dark: #1B5E20;
      --accent-soft: #1B2C1E;
    }

    .app-shell .panel-surface {
      background: var(--surface) !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }

    .app-shell .panel-surface > div,
    .app-shell table,
    .app-shell select {
      color: var(--text) !important;
    }

    .app-shell input,
    .app-shell select {
      background: var(--surface-soft) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
    }

    .app-shell .muted-text { color: var(--muted) !important; }

    .app-shell.dark .step-badge {
      border-color: var(--accent) !important;
      color: #fff !important;
      background: var(--accent) !important;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .agro-header {
      max-width: 1200px;
      margin: 0 auto 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #FFFFFF;
      background: var(--accent-dark);
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 11px;
      color: var(--text);
      background: var(--surface-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto 20px;
    }

    .metric-card {
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
    }

    .reader-frame {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .reader-frame:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .located-card {
      animation: located-in 180ms ease-out;
      box-shadow: 0 8px 24px rgba(27, 94, 32, 0.12);
    }

    .located-code {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-soft);
    }

    @keyframes located-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .agro-header { align-items: flex-start; flex-direction: column; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      user-select: none;
      min-height: 40px;
      touch-action: manipulation;
    }

    .app-content {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .history-table-wrap,
    .items-table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .history-cards {
      display: none;
    }

    .scanner-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(4, 12, 6, 0.72);
    }

    .scanner-modal {
      width: min(100%, 520px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .scanner-video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #071009;
    }

    .scanner-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(4, 12, 6, 0.7);
    }

    .app-modal {
      width: min(100%, 620px);
      max-height: min(92vh, 820px);
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .label-preview {
      display: grid;
      place-items: center;
      width: min(100%, 420px);
      min-height: 230px;
      margin: 16px auto;
      padding: 18px;
      border: 1px dashed var(--accent);
      background: #fff;
      color: #172117;
      text-align: center;
    }

    .label-preview canvas { max-width: 180px; height: auto !important; }

    @media print {
      body * { visibility: hidden !important; }
      .print-label, .print-label * { visibility: visible !important; }
      .print-label { position: absolute; inset: 0; display: grid; place-items: center; }
    }

    @media (min-width: 760px) {
      .app-shell {
        padding: clamp(24px, 4vw, 48px) clamp(20px, 4vw, 56px) !important;
      }

      .desktop-main-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 20px;
        align-items: start;
      }

      .desktop-main-grid > .panel-full {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 759px) {
      .app-shell {
        padding: 16px 12px !important;
      }

      .agro-header {
        margin-bottom: 14px;
        padding: 14px;
      }

      .brand-mark { min-width: 0; }
      .brand-mark > div:last-child { min-width: 0; }
      .brand-mark > div:last-child > div:first-child {
        font-size: clamp(14px, 4vw, 18px) !important;
        overflow-wrap: anywhere;
      }

      .metric-grid {
        gap: 8px;
        margin-bottom: 14px;
      }

      .metric-card { padding: 11px 12px; }
      .metric-card > div:last-child { font-size: 18px !important; }

      .panel-actions { width: 100%; justify-content: stretch; }
      .panel-actions > * { flex: 1 1 140px; }
      .panel-actions button { width: 100%; }

      .history-table-wrap { display: none; }
      .history-cards { display: grid; gap: 8px; }
      .history-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-soft);
      }
      .history-card-label {
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .history-card-value { overflow-wrap: anywhere; }
      .history-card-code { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

        .inventory-row {
          grid-template-columns: 1fr 1fr !important;
        }

      .items-table-wrap { overflow-x: visible; }
      .items-table-wrap table { min-width: 0 !important; }
      .items-table-wrap thead { display: none; }
      .items-table-wrap tbody,
      .items-table-wrap tr,
      .items-table-wrap td { display: block; width: 100%; }
      .items-table-wrap tr {
        margin-bottom: 10px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 7px;
      }
      .items-table-wrap td {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 7px 0 !important;
        border-bottom: 1px solid var(--border) !important;
        white-space: normal !important;
        overflow-wrap: anywhere;
      }
      .items-table-wrap td:last-child { border-bottom: 0 !important; }

      .reader-frame input { min-width: 0; font-size: clamp(16px, 5vw, 20px) !important; }
      .reader-actions { display: grid !important; grid-template-columns: 1fr !important; }
      .reader-actions button { width: 100%; min-height: 48px; }
      .located-code { overflow-wrap: anywhere; }
      .box-card-actions { display: grid !important; grid-template-columns: 1fr 1fr !important; }
    }

    @media (max-width: 380px) {
      .metric-grid { grid-template-columns: 1fr 1fr; }
      .metric-card > div:first-child { font-size: 9px !important; letter-spacing: .04em !important; }
      .theme-toggle { width: 100%; justify-content: center; }
    }

    @media (min-width: 1200px) {
      .desktop-main-grid { grid-template-columns: minmax(0, 1fr) minmax(390px, .85fr); }
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    /* =========================================================
       REACT
    ========================================================= */

    const {
      useState,
      useMemo,
      useRef,
      useCallback,
      useEffect
    } = React;


    /* =========================================================
       ÍCONES
       Criados diretamente em SVG para evitar o erro React #130
    ========================================================= */

    const Icon = ({
      name,
      size = 18,
      color = "currentColor",
      strokeWidth = 2,
      style = {}
    }) => {

      const common = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: color,
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        style: {
          display: "inline-block",
          flexShrink: 0,
          ...style
        }
      };

      const icons = {

        UploadCloud: (
          <svg {...common}>
            <path d="M16 16l-4-4-4 4" />
            <path d="M12 12v9" />
            <path d="M20.39 17.39A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.3" />
          </svg>
        ),

        FileSpreadsheet: (
          <svg {...common}>
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18" />
            <path d="M9 3v18" />
            <path d="M15 9v12" />
            <path d="M9 15h6" />
          </svg>
        ),

        Settings2: (
          <svg {...common}>
            <path d="M20 7h-9" />
            <path d="M14 17H5" />
            <circle cx="17" cy="7" r="3" />
            <circle cx="7" cy="17" r="3" />
          </svg>
        ),

        Search: (
          <svg {...common}>
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
        ),

        X: (
          <svg {...common}>
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        ),

        Check: (
          <svg {...common}>
            <path d="m5 12 4 4L19 6" />
          </svg>
        ),

        RotateCcw: (
          <svg {...common}>
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        ),

        AlertTriangle: (
          <svg {...common}>
            <path d="m21 21-1.8-3.2" />
            <path d="M5 17.8 3 21" />
            <path d="M3.3 16.5 12 3l8.7 13.5a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3Z" />
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
          </svg>
        ),

        Printer: (
          <svg {...common}>
            <path d="M6 9V2h12v7" />
            <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
            <path d="M6 14h12v8H6z" />
          </svg>
        ),

        Sun: (
          <svg {...common}>
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        ),

        Moon: (
          <svg {...common}>
            <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z" />
          </svg>
        ),

        Activity: (
          <svg {...common}>
            <path d="M3 12h4l2-7 4 14 2-7h6" />
          </svg>
        ),

        Camera: (
          <svg {...common}>
            <path d="M4 7h3l1.5-2h7L17 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z" />
            <circle cx="12" cy="13" r="3.5" />
          </svg>
        )
      };

      return icons[name] || null;
    };


    /* =========================================================
       CORES
    ========================================================= */

    const PAPER = "#F1F1EC";
    const PANEL = "#FFFFFF";

    const INK = "#1E2A38";
    const INK_SOFT = "#5B6B7C";

    const LINE = "#D8D9D0";
    const LINE_STRONG = "#B7BAAF";

    const AMBER = "#C97A1C";
    const AMBER_BG = "#FBEEDD";

    const GREEN = "#2E7D5B";
    const GREEN_BG = "#E4F2EA";

    const RED = "#B3402E";
    const RED_BG = "#FBEAE6";

    const PURPLE = "#7A3E9D";
    const PURPLE_BG = "#F0E6F5";
    const BLUE = "#2468A8";
    const BLUE_BG = "#E5F0FA";
    const ORANGE = "#C96A16";
    const ORANGE_BG = "#FCE8D2";
    const HISTORY_STORAGE_KEY = "selecao-material-historico-v1";
    const BOXES_STORAGE_KEY = "selecao-material-caixas-v1";
    const MOVEMENTS_STORAGE_KEY = "selecao-material-movimentacoes-v1";
    const BACKUP_VERSION = 1;


    /* =========================================================
       FONTES
    ========================================================= */

    const FONT_IMPORT = `
      @import url(
        'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700
        &family=IBM+Plex+Sans:wght@400;500;600
        &family=IBM+Plex+Mono:wght@400;500;600
        &display=swap'
      );
    `;


    /* =========================================================
       IDENTIFICAÇÃO AUTOMÁTICA DA COLUNA
    ========================================================= */

    function guessIdColumn(headers) {

      const patterns = [
        "qr",
        "codigo",
        "código",
        "cod",
        "id",
        "sku",
        "material",
        "tag"
      ];

      for (const p of patterns) {

        const found = headers.find((h) =>
          String(h).toLowerCase().includes(p)
        );

        if (found) {
          return found;
        }
      }

      return headers[0] || "";
    }

    function normalizeValue(value) {
      return String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    function getAvancoStatus(row) {
      const column = Object.keys(row).find(
        (key) => ["avanco", "avanço"].includes(normalizeValue(key))
      );
      const value = normalizeValue(column ? row[column] : "");

      if (["sim", "yes", "s", "true"].includes(value)) return "sim";
      if (["nao", "não", "no", "n", "false"].includes(value)) return "nao";
      return "";
    }

    function getManualHighlightColor(row, highlightRule) {
      if (!highlightRule?.column || !highlightRule.value.trim()) return "";
      return normalizeValue(row[highlightRule.column]) === normalizeValue(highlightRule.value)
        ? highlightRule.color
        : "";
    }

    function getRowColor(sheetName, row, colorRules, highlightRule) {
      const manualColor = getManualHighlightColor(row, highlightRule);
      if (manualColor) return manualColor;
      const name = normalizeValue(sheetName);

      const traitColumn = Object.keys(row).find(
        (key) => normalizeValue(key) === "trait"
      );
      const traitValue = normalizeValue(traitColumn ? row[traitColumn] : "");
      const avancoStatus = getAvancoStatus(row);

      const getTraitColor = () => {
        if (traitValue === "ce3") return colorRules.trait.ce3;
        if (traitValue === "e3") return colorRules.trait.e3;
        if (traitValue === "i5+") return colorRules.trait.i5;
        if (traitValue === "gmb") return colorRules.trait.gmb;
        if (traitValue === "con") return colorRules.trait.con;
        return "";
      };

      const getAvancoColor = () => {
        if (avancoStatus === "sim") {
          return colorRules.avanco.sim;
        }
        if (avancoStatus === "nao") {
          return colorRules.avanco.nao;
        }
        return "";
      };

      if (name.includes("avanco") || name.includes("avanço")) {
        return getAvancoColor();
      }
      if (name.includes("trait")) {
        return getTraitColor();
      }

      return getTraitColor() || getAvancoColor();
    }


    /* =========================================================
       BADGE DOS PASSOS
    ========================================================= */

    function StepBadge({ n, active }) {

      return (
        <div
          style={{
            width: 30,
            height: 30,
            borderRadius: 4,

            border:
              `1.5px solid ${
                active ? INK : LINE_STRONG
              }`,

            color:
              active ? PAPER : INK_SOFT,

            background:
              active ? INK : "transparent",

            display: "flex",
            alignItems: "center",
            justifyContent: "center",

            fontFamily:
              "'IBM Plex Mono', monospace",

            fontWeight: 600,
            fontSize: 13,

            flexShrink: 0
          }}
        >
          {n}
        </div>
      );
    }


    /* =========================================================
       PAINEL
    ========================================================= */

    function Panel({
      step,
      title,
      active,
      children,
      trailing
    }) {

      return (
        <section
          className="panel-surface"
          style={{
            background: PANEL,

            border:
              `1px solid ${LINE}`,

            borderRadius: 6,

            marginBottom: 20,

            opacity:
              active ? 1 : 0.55,

            transition:
              "opacity 0.2s ease"
          }}
        >

          <div
            style={{
              display: "flex",
              alignItems: "center",
              gap: 12,

              padding:
                "14px 18px",

              borderBottom:
                `1px solid ${LINE}`
            }}
          >

            <StepBadge
              n={step}
              active={active}
            />

            <span
              style={{
                fontFamily:
                  "'Space Grotesk', sans-serif",

                fontWeight: 600,
                fontSize: 14,

                letterSpacing:
                  "0.03em",

                textTransform:
                  "uppercase",

                color: INK,

                flex: 1
              }}
            >
              {title}
            </span>

            {trailing}

          </div>

          <div
            style={{
              padding: 18
            }}
          >
            {children}
          </div>

        </section>
      );
    }

    function ColorOption({ label, value, onChange }) {
      return (
        <label
          style={{
            display: "flex",
            alignItems: "center",
            gap: 8,
            fontSize: 12.5,
            color: INK_SOFT
          }}
        >
          <input
            type="color"
            value={value}
            onChange={(e) => onChange(e.target.value)}
            style={{ width: 28, height: 24, padding: 0, border: 0, cursor: "pointer" }}
          />
          {label}
        </label>
      );
    }


    /* =========================================================
       APLICAÇÃO
    ========================================================= */

    function App() {

      const [fileName, setFileName] =
        useState("");

      const [headers, setHeaders] =
        useState([]);

      const [rows, setRows] =
        useState([]);

      const [sheets, setSheets] =
        useState([]);

      const [selectedSheets, setSelectedSheets] =
        useState([]);

      const [idColumn, setIdColumn] =
        useState("");

      const [displayColumns, setDisplayColumns] =
        useState([]);

      const [highlightedFields, setHighlightedFields] =
        useState(["Trait", "Avanco", "Avanço"]);

      const [highlightedFieldsColor, setHighlightedFieldsColor] =
        useState("#FFF1B8");

      const [query, setQuery] =
        useState("");

      const [matched, setMatched] =
        useState(null);

      const [searchState, setSearchState] =
        useState("idle");

      const [dragOver, setDragOver] =
        useState(false);

      const [parseError, setParseError] =
        useState("");

      const [theme, setTheme] =
        useState(() => localStorage.getItem("agro-material-theme") || "light");

      const [history, setHistory] =
        useState([]);

      const [showFullHistory, setShowFullHistory] =
        useState(false);

      const [boxes, setBoxes] =
        useState(() => JSON.parse(localStorage.getItem(BOXES_STORAGE_KEY) || "[]"));

      const [movements, setMovements] =
        useState(() => JSON.parse(localStorage.getItem(MOVEMENTS_STORAGE_KEY) || "[]"));

      const [activeBoxId, setActiveBoxId] =
        useState("");

      const [newBoxDescription, setNewBoxDescription] =
        useState("");

      const [newBoxNote, setNewBoxNote] =
        useState("");

      const [inventoryQuery, setInventoryQuery] =
        useState("");

      const [showInventory, setShowInventory] =
        useState(false);

      const [exportMessage, setExportMessage] =
        useState("");

      const [deleteBoxCandidate, setDeleteBoxCandidate] =
        useState(null);

      const backupInputRef =
        useRef(null);

      const [lastProcessedCode, setLastProcessedCode] =
        useState("");

      const [colorRules, setColorRules] =
        useState({
          avanco: {
            sim: GREEN_BG,
            nao: RED_BG
          },
          trait: {
            ce3: PURPLE_BG,
            e3: GREEN_BG,
            i5: BLUE_BG,
            gmb: RED_BG,
            con: ORANGE_BG
          },
          manual: {
            color: "#FFF1B8"
          }
        });

      const [highlightRule, setHighlightRule] =
        useState({ column: "", value: "", color: "#FFF1B8" });

      const inputRef =
        useRef(null);

      const searchInputRef =
        useRef(null);

      const scannerVideoRef =
        useRef(null);

      const scannerStreamRef =
        useRef(null);

      const [scannerOpen, setScannerOpen] =
        useState(false);

      const [scannerStatus, setScannerStatus] =
        useState("");

      useEffect(() => {
        loadHistory();
      }, []);

      useEffect(() => {
        localStorage.setItem(BOXES_STORAGE_KEY, JSON.stringify(boxes));
      }, [boxes]);

      useEffect(() => {
        localStorage.setItem(MOVEMENTS_STORAGE_KEY, JSON.stringify(movements));
      }, [movements]);

      useEffect(() => {
        localStorage.setItem("agro-material-theme", theme);
      }, [theme]);

      useEffect(() => {
        if (!scannerOpen) return undefined;

        let cancelled = false;
        let animationFrame = 0;

        const stopStream = () => {
          if (scannerStreamRef.current) {
            scannerStreamRef.current.getTracks().forEach((track) => track.stop());
            scannerStreamRef.current = null;
          }
        };

        const scanFrame = async (detector) => {
          if (cancelled || !scannerVideoRef.current) return;
          try {
            const results = await detector.detect(scannerVideoRef.current);
            if (results.length > 0 && results[0].rawValue) {
              const value = results[0].rawValue;
              setScannerStatus("Leitura concluída");
              if (navigator.vibrate) navigator.vibrate(120);
              try {
                const audio = new AudioContext();
                const oscillator = audio.createOscillator();
                const gain = audio.createGain();
                oscillator.connect(gain);
                gain.connect(audio.destination);
                oscillator.frequency.value = 880;
                gain.gain.setValueAtTime(0.08, audio.currentTime);
                oscillator.start();
                oscillator.stop(audio.currentTime + 0.12);
              } catch (error) {
              }
              stopStream();
              setScannerOpen(false);
              processQRCode(value);
              return;
            }
          } catch (error) {
            setScannerStatus("Aponte a câmera para um QR Code");
          }
          animationFrame = requestAnimationFrame(() => scanFrame(detector));
        };

        const startScanner = async () => {
          if (!navigator.mediaDevices?.getUserMedia) {
            setScannerStatus("Câmera indisponível. Digite o código abaixo.");
            return;
          }
          if (!window.BarcodeDetector) {
            setScannerStatus("Este navegador não detecta QR automaticamente. Digite o código abaixo.");
            return;
          }
          try {
            setScannerStatus("Solicitando acesso à câmera...");
            const stream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: { ideal: "environment" } },
              audio: false
            });
            if (cancelled || !scannerVideoRef.current) {
              stream.getTracks().forEach((track) => track.stop());
              return;
            }
            scannerStreamRef.current = stream;
            scannerVideoRef.current.srcObject = stream;
            await scannerVideoRef.current.play();
            setScannerStatus("Aponte a câmera para um QR Code");
            scanFrame(new BarcodeDetector({ formats: ["qr_code"] }));
          } catch (error) {
            setScannerStatus("Não foi possível acessar a câmera. Verifique a permissão.");
          }
        };

        startScanner();
        return () => {
          cancelled = true;
          cancelAnimationFrame(animationFrame);
          stopStream();
        };
      }, [scannerOpen]);

      /* =====================================================
         ESTADOS DERIVADOS
      ===================================================== */

      const hasData =
        rows.length > 0 &&
        headers.length > 0;

      const selectedRows =
        useMemo(
          () => rows.filter((row) => selectedSheets.includes(row.__sheetName)),
          [rows, selectedSheets]
        );

      const readyToSearch =
        hasData &&
        idColumn &&
        selectedRows.length > 0;

      useEffect(() => {
        if (readyToSearch && searchInputRef.current) {
          searchInputRef.current.focus();
        }
      }, [readyToSearch]);

      const matchedRowColor =
        matched
          ? getRowColor(matched.__sheetName, matched, colorRules)
          : "";

      const matchedAvancoStatus =
        matched ? getAvancoStatus(matched) : "";

      const matchedAvancoColor =
        matchedAvancoStatus === "sim"
          ? colorRules.avanco.sim
          : matchedAvancoStatus === "nao"
            ? colorRules.avanco.nao
            : "";

      const matchedAvancoTextColor =
        matchedAvancoStatus === "sim" ? GREEN : RED;

      const matchedAvancoValue =
        matched
          ? Object.entries(matched).find(
              ([key]) => ["avanco", "avanço"].includes(normalizeValue(key))
            )?.[1]
          : "";

      const foundMaterialsCount =
        history.filter((item) => item.status === "ENCONTRADO").length;

      const notFoundMaterialsCount =
        history.filter((item) => item.status === "NÃO ENCONTRADO").length;

      const latestReading = history[0];

      const activeBox =
        boxes.find((box) => box.id === activeBoxId) || null;

      const inventoryRecords =
        history.map((item) => ({
          ...item,
          description: displayColumns[0] ? item.rowData?.[displayColumns[0]] || "" : "",
          box: boxes.find((box) => box.materials?.some((material) => normalizeValue(material.code) === normalizeValue(item.code))) || null
        }));

      const filteredInventory =
        inventoryRecords.filter((item) => {
          const term = normalizeValue(inventoryQuery);
          if (!term) return true;
          return [item.code, item.description, item.box?.number, item.date, item.status]
            .some((value) => normalizeValue(value).includes(term));
        });


      /* =====================================================
         PROCESSAR PLANILHA
      ===================================================== */

      const processFile =
        useCallback((file) => {

          if (!file) {
            return;
          }

          setParseError("");

          const reader =
            new FileReader();

          reader.onload =
            (e) => {

              try {

                const data =
                  new Uint8Array(
                    e.target.result
                  );

                const workbook =
                  XLSX.read(
                    data,
                    {
                      type: "array",
                      dense: true,
                      cellFormula: false
                    }
                  );

                if (
                  !workbook.SheetNames ||
                  workbook.SheetNames.length === 0
                ) {

                  setParseError(
                    "Não foi encontrada nenhuma planilha no arquivo."
                  );

                  return;
                }

                const parsedSheets = workbook.SheetNames
                  .map((sheetName) => {
                    const sheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(sheet, {
                      defval: "",
                      raw: false
                    });
                    return { name: sheetName, rows: json };
                  })
                  .filter((sheet) => sheet.rows.length > 0);

                if (!parsedSheets.length) {

                  setParseError(
                    "A planilha está vazia ou não foi possível ler as colunas."
                  );

                  return;
                }

                const hdrs = Array.from(new Set(
                  parsedSheets.flatMap((sheet) => Object.keys(sheet.rows[0]))
                ));

                if (!hdrs.length) {

                  setParseError(
                    "Não foram encontradas colunas na planilha."
                  );

                  return;
                }

                const allRows = parsedSheets.flatMap((sheet) =>
                  sheet.rows.map((row) => ({ ...row, __sheetName: sheet.name }))
                );

                setSheets(parsedSheets);
                setSelectedSheets(parsedSheets.map((sheet) => sheet.name));
                setHeaders(hdrs);
                setRows(allRows);
                setFileName(file.name);

                const guessed =
                  guessIdColumn(hdrs);

                setIdColumn(guessed);

                setDisplayColumns(
                  hdrs.filter(
                    (h) => h !== guessed
                  )
                );

                setQuery("");
                setMatched(null);
                setSearchState("idle");

              } catch (err) {

                console.error(err);

                setParseError(
                  "Não foi possível ler este arquivo. Confirme se é um .xlsx, .xls ou .csv válido."
                );
              }
            };

          reader.readAsArrayBuffer(file);

        }, []);


      /* =====================================================
         INPUT DE ARQUIVO
      ===================================================== */

      const handleFileInput =
        (e) => {

          const file =
            e.target.files &&
            e.target.files[0];

          if (file) {
            processFile(file);
          }
        };


      /* =====================================================
         ARRASTAR ARQUIVO
      ===================================================== */

      const handleDrop =
        (e) => {

          e.preventDefault();

          setDragOver(false);

          const file =
            e.dataTransfer.files &&
            e.dataTransfer.files[0];

          if (file) {
            processFile(file);
          }
        };


      /* =====================================================
         RESET
      ===================================================== */

      const resetAll =
        () => {

          setFileName("");
          setHeaders([]);
          setRows([]);
          setSheets([]);
          setSelectedSheets([]);
          setIdColumn("");
          setDisplayColumns([]);
          setQuery("");
          setMatched(null);
          setSearchState("idle");
          setParseError("");

          if (inputRef.current) {
            inputRef.current.value = "";
          }
        };


      /* =====================================================
         SUGESTÕES
      ===================================================== */

      const suggestions =
        useMemo(() => {

          if (
            !readyToSearch ||
            !query.trim()
          ) {
            return [];
          }

          const q =
            query
              .trim()
              .toLowerCase();

          return selectedRows
            .filter((r) =>
              String(
                r[idColumn] ?? ""
              )
              .toLowerCase()
              .includes(q)
            )
            .slice(0, 8);

        }, [
          selectedRows,
          idColumn,
          query,
          readyToSearch
        ]);


      /* =====================================================
         PESQUISA
      ===================================================== */

      const runSearch =
        (value) => {

          const q =
            String(
              value ?? query
            )
            .trim()
            .toLowerCase();

          if (!q) {

            setMatched(null);
            setSearchState("idle");

            return;
          }

          const exact =
            selectedRows.find(
              (r) =>
                String(
                  r[idColumn] ?? ""
                )
                .trim()
                .toLowerCase() === q
            );

          if (exact) {

            setMatched(exact);
            setSearchState("found");

          } else {

            setMatched(null);
            setSearchState("notfound");
          }
        };

      const loadHistory =
        () => {
          try {
            const savedHistory = JSON.parse(
              localStorage.getItem(HISTORY_STORAGE_KEY) || "[]"
            );
            const normalizedHistory = Array.isArray(savedHistory)
              ? savedHistory.filter((item) => item && item.number)
              : [];
            setHistory(normalizedHistory);
            return normalizedHistory;
          } catch (error) {
            console.warn("Não foi possível carregar o histórico.", error);
            return [];
          }
        };

      const addToHistory =
        (code, exact, date, time) => {
          const rowData = exact
            ? headers.reduce((data, header) => ({
                ...data,
                [header]: exact[header] ?? ""
              }), {})
            : {};
          const status = exact ? "ENCONTRADO" : "NÃO ENCONTRADO";

          setHistory((previousHistory) => {
            const nextNumber = previousHistory.reduce(
              (highest, item) => Math.max(highest, Number(item.number) || 0),
              0
            ) + 1;
            const record = {
              number: nextNumber,
              date,
              time,
              code,
              status,
              sheetName: exact?.__sheetName || "",
              rowData
            };
            const nextHistory = [record, ...previousHistory];
            localStorage.setItem(
              HISTORY_STORAGE_KEY,
              JSON.stringify(nextHistory)
            );
            return nextHistory;
          });
        };

      const addMovement =
        (action, code, exact, boxNumber = "") => {
          const now = new Date();
          const movement = {
            id: `${now.getTime()}-${Math.random().toString(36).slice(2, 8)}`,
            date: now.toLocaleDateString("pt-BR"),
            time: now.toLocaleTimeString("pt-BR", { hour12: false }),
            code,
            description: exact && displayColumns[0] ? exact[displayColumns[0]] || "" : "",
            action,
            box: boxNumber,
            user: ""
          };
          setMovements((previous) => [movement, ...previous]);
        };

      const createBox =
        () => {
          const now = new Date();
          const nextNumber = boxes.reduce((max, box) => Math.max(max, Number(box.number) || 0), 0) + 1;
          const box = {
            id: `box-${now.getTime()}`,
            number: String(nextNumber).padStart(3, "0"),
            description: newBoxDescription.trim(),
            note: newBoxNote.trim(),
            createdAt: now.toLocaleDateString("pt-BR"),
            status: "ABERTA",
            materials: []
          };
          setBoxes((previous) => [box, ...previous]);
          setActiveBoxId(box.id);
          setNewBoxDescription("");
          setNewBoxNote("");
        };

      const requestDeleteBox =
        (box) => setDeleteBoxCandidate(box);

      const confirmDeleteBox =
        () => {
          if (!deleteBoxCandidate) return;
          const materialCodes = (deleteBoxCandidate.materials || []).map((material) => normalizeValue(material.code));
          setBoxes((previous) => previous.filter((box) => box.id !== deleteBoxCandidate.id));
          if (materialCodes.length) {
            setHistory((previous) => {
              const nextHistory = previous.filter((item) => !materialCodes.includes(normalizeValue(item.code)));
              localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(nextHistory));
              return nextHistory;
            });
          }
          setMovements((previous) => [{
            id: `box-delete-${Date.now()}`,
            date: new Date().toLocaleDateString("pt-BR"),
            time: new Date().toLocaleTimeString("pt-BR", { hour12: false }),
            code: `CX${deleteBoxCandidate.number}`,
            description: deleteBoxCandidate.description || "",
            action: "CAIXA EXCLUÍDA",
            box: deleteBoxCandidate.number,
            user: ""
          }, ...previous]);
          if (activeBoxId === deleteBoxCandidate.id) setActiveBoxId("");
          setDeleteBoxCandidate(null);
          setExportMessage(`CAIXA ${deleteBoxCandidate.number} excluída${materialCodes.length ? ` e ${materialCodes.length} material(is) removido(s) do estoque` : ""}.`);
        };

      const finishActiveBox =
        () => {
          if (!activeBox) return;
          setBoxes((previous) => previous.map((box) => box.id === activeBox.id ? { ...box, status: "ARMAZENADA" } : box));
          addMovement("CAIXA FINALIZADA", "", null, activeBox.number);
          setActiveBoxId("");
        };

      const updateBoxForMaterial =
        (code, exact, date, time) => {
          if (!activeBox) return;
          const existingBox = boxes.find((box) => box.materials?.some((material) => normalizeValue(material.code) === normalizeValue(code)));
          if (existingBox && existingBox.id !== activeBox.id) {
            const shouldTransfer = window.confirm(`Este material já está armazenado na CAIXA ${existingBox.number}.\n\nOK: transferir para ${activeBox.number}\nCancelar: manter na caixa atual`);
            if (!shouldTransfer) return;
            setBoxes((previous) => previous.map((box) => {
              if (box.id === existingBox.id) return { ...box, materials: box.materials.filter((material) => normalizeValue(material.code) !== normalizeValue(code)) };
              if (box.id === activeBox.id) return { ...box, materials: [...(box.materials || []), { code, description: exact && displayColumns[0] ? exact[displayColumns[0]] || "" : "", date, time }] };
              return box;
            }));
            addMovement("TRANSFERIDO", code, exact, activeBox.number);
            return;
          }
          if (existingBox && existingBox.id === activeBox.id) {
            if (!window.confirm("ATENÇÃO: este material já foi registrado nesta caixa.\n\nAdicionar novamente?")) return;
          }
          setBoxes((previous) => previous.map((box) => box.id === activeBox.id ? {
            ...box,
            materials: [...(box.materials || []), { code, description: exact && displayColumns[0] ? exact[displayColumns[0]] || "" : "", date, time }]
          } : box));
          addMovement(existingBox ? "BIPADO NOVAMENTE" : "BIPADO", code, exact, activeBox.number);
        };

      const processQRCode =
        (value) => {
          const code = String(value ?? "").trim();
          const scannedBox = boxes.find((box) => normalizeValue(`CX${box.number}`) === normalizeValue(code) || normalizeValue(`CAIXA-${box.number}`) === normalizeValue(code) || normalizeValue(`CAIXA ${box.number}`) === normalizeValue(code));
          if (scannedBox) {
            setActiveBoxId(scannedBox.id);
            setLastProcessedCode(code);
            setSearchState("found");
            setExportMessage(`CAIXA ${scannedBox.number} ATIVA`);
            if (navigator.vibrate) navigator.vibrate(100);
            return;
          }
          if (!code || !readyToSearch) {
            if (searchInputRef.current) searchInputRef.current.focus();
            return;
          }

          const exact = selectedRows.find(
            (row) => normalizeValue(row[idColumn]) === normalizeValue(code)
          );
          const now = new Date();
          const date = now.toLocaleDateString("pt-BR");
          const time = now.toLocaleTimeString("pt-BR", { hour12: false });

          setLastProcessedCode(code);
          setQuery("");
          if (exact) {
            setMatched(exact);
            setSearchState("found");
          } else {
            setMatched(null);
            setSearchState("notfound");
          }
          addToHistory(code, exact, date, time);
          updateBoxForMaterial(code, exact, date, time);

          requestAnimationFrame(() => {
            if (searchInputRef.current) searchInputRef.current.focus();
          });
        };

      const clearHistory =
        () => {
          if (!history.length) return;
          if (window.confirm("Deseja realmente limpar todo o histórico de leituras?")) {
            localStorage.removeItem(HISTORY_STORAGE_KEY);
            setHistory([]);
          }
        };

      const exportHistory =
        () => {
          if (!history.length) return;
          const exportRows = history
            .slice()
            .reverse()
            .map((item) => ({
              "Nº": item.number,
              "Data": item.date,
              "Hora": item.time,
              "QR Code": item.code,
              "Status": item.status,
              ...headers.reduce((data, header) => ({
                ...data,
                [header]: item.rowData?.[header] ?? "-"
              }), {})
            }));
          const worksheet = XLSX.utils.json_to_sheet(exportRows);
          const workbook = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(workbook, worksheet, "Leituras");
          XLSX.writeFile(workbook, "Historico_Leituras.xlsx");
        };

      const getExportRows =
        () => history.slice().reverse().map((item) => ({
          Codigo: item.code,
          Descricao: displayColumns[0] ? item.rowData?.[displayColumns[0]] || "" : "",
          Data: item.date,
          Hora: item.time,
          Usuario: item.user || "",
          Status: item.status,
          Caixa: boxes.find((box) => box.materials?.some((material) => normalizeValue(material.code) === normalizeValue(item.code)))?.number || ""
        }));

      const getExportFileName =
        (extension, prefix = "Historico_Bipagens") => {
          const now = new Date();
          const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}_${String(now.getHours()).padStart(2, "0")}-${String(now.getMinutes()).padStart(2, "0")}`;
          return `${prefix}_${stamp}.${extension}`;
        };

      const downloadBlob =
        (blob, fileName) => {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = fileName;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        };

      const saveLocalHistory =
        async (format = "xlsx") => {
          if (!history.length) {
            setExportMessage("Não há bipagens para exportar.");
            return;
          }
          const fileName = getExportFileName(format);
          const rowsToExport = getExportRows();
          let blob;
          if (format === "csv") {
            const worksheet = XLSX.utils.json_to_sheet(rowsToExport);
            const csv = XLSX.utils.sheet_to_csv(worksheet);
            blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
          } else {
            const worksheet = XLSX.utils.json_to_sheet(rowsToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Bipagens");
            blob = new Blob([XLSX.write(workbook, { bookType: "xlsx", type: "array" })], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
          }
          try {
            if (window.showDirectoryPicker) {
              const directory = await window.showDirectoryPicker({ mode: "readwrite" });
              const root = await directory.getDirectoryHandle("Controle de Estoque", { create: true });
              const historyDirectory = await root.getDirectoryHandle("Historico", { create: true });
              const fileHandle = await historyDirectory.getFileHandle(fileName, { create: true });
              const writable = await fileHandle.createWritable();
              await writable.write(blob);
              await writable.close();
              setExportMessage("Histórico salvo com sucesso em: Controle de Estoque > Historico");
              return;
            }
          } catch (error) {
            if (error?.name === "AbortError") return;
          }
          downloadBlob(blob, fileName);
          setExportMessage(`Download criado: ${fileName}`);
        };

      const exportFullBackup =
        () => {
          const payload = { version: BACKUP_VERSION, exportedAt: new Date().toISOString(), history, boxes, movements, rows, headers, selectedSheets, idColumn, displayColumns };
          downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }), getExportFileName("json", "Backup_Controle_Estoque"));
          setExportMessage("Backup completo exportado com sucesso.");
        };

      const restoreBackup =
        (event) => {
          const file = event.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const payload = JSON.parse(reader.result);
              if (payload.version !== BACKUP_VERSION || !Array.isArray(payload.history) || !Array.isArray(payload.boxes)) throw new Error("Formato inválido");
              if (!window.confirm("Restaurar o backup substituirá os dados locais atuais. Continuar?")) return;
              setHistory(payload.history);
              setBoxes(payload.boxes);
              setMovements(Array.isArray(payload.movements) ? payload.movements : []);
              setRows(Array.isArray(payload.rows) ? payload.rows : []);
              setHeaders(Array.isArray(payload.headers) ? payload.headers : []);
              setSelectedSheets(Array.isArray(payload.selectedSheets) ? payload.selectedSheets : []);
              setIdColumn(payload.idColumn || "");
              setDisplayColumns(Array.isArray(payload.displayColumns) ? payload.displayColumns : []);
              localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(payload.history));
              localStorage.setItem(BOXES_STORAGE_KEY, JSON.stringify(payload.boxes));
              localStorage.setItem(MOVEMENTS_STORAGE_KEY, JSON.stringify(Array.isArray(payload.movements) ? payload.movements : []));
              setExportMessage("Backup restaurado com sucesso.");
            } catch (error) {
              setExportMessage("Não foi possível restaurar este backup.");
            }
          };
          reader.readAsText(file);
          event.target.value = "";
        };

      const exportBox =
        (box, format) => {
          if (!box) return;
          const rowsToExport = (box.materials || []).map((material) => ({ Codigo: material.code, Descricao: material.description, Data: material.date, Hora: material.time, Caixa: box.number, Status: box.status }));
          if (format === "pdf") {
            const printWindow = window.open("", "_blank");
            if (!printWindow) return;

                </div>
                </>
              )}
            </Panel>

            <Panel step={6} title="Histórico de movimentações" active={movements.length > 0}>
              {!movements.length ? (
                <div className="muted-text" style={{ fontSize: 13 }}>As movimentações de caixas aparecerão aqui.</div>
              ) : (
                <div className="history-cards" style={{ display: "grid" }}>
                  {movements.slice(0, showFullHistory ? movements.length : 10).map((movement) => (
                    <div className="history-card" key={movement.id}>
                      <div><div className="history-card-label">Data e hora</div><div className="history-card-value">{movement.date} {movement.time}</div></div>
                      <div style={{ textAlign: "right" }}><div className="history-card-label">Ação</div><div className="history-card-value" style={{ fontWeight: 700 }}>{movement.action}</div></div>
                      <div><div className="history-card-label">Código</div><div className="history-card-value history-card-code">{movement.code || "-"}</div></div>
                      <div style={{ textAlign: "right" }}><div className="history-card-label">Caixa</div><div className="history-card-value">{movement.box ? `CAIXA ${movement.box}` : "-"}</div></div>
                    </div>
                  ))}
                </div>
              )}
            </Panel>


            {/* =================================================
                TABELA
            ================================================= */}

            {hasData && (

              <Panel
                step={5}
                title={
                  `Itens selecionados (${selectedRows.length})`
                }
                active={true}
              >

                <div className="items-table-wrap">

                  <table
                    style={{
                      width: "100%",

                      borderCollapse:
                        "collapse",

                      fontSize: 12.5
                    }}
                  >

                    <thead>

                      <tr>

                        <th
                          style={{
                            textAlign:
                              "left",

                            padding:
                              "8px 10px",

                            borderBottom:
                              `2px solid ${INK}`,

                            color: INK,

                            fontFamily:
                              "'IBM Plex Mono', monospace",

                            whiteSpace:
                              "nowrap"
                          }}
                        >
                          {idColumn}
                        </th>

                        <th
                          style={{
                            textAlign: "left",
                            padding: "8px 10px",
                            borderBottom: `2px solid ${INK}`,
                            color: INK_SOFT,
                            fontWeight: 500,
                            whiteSpace: "nowrap"
                          }}
                        >
                          Aba
                        </th>


                        {displayColumns.map(
                          (h) => (

                            <th
                              key={h}

                              style={{
                                textAlign:
                                  "left",

                                padding:
                                  "8px 10px",

                                borderBottom:
                                  `2px solid ${INK}`,

                                color:
                                  INK_SOFT,

                                fontWeight:
                                  500,

                                whiteSpace:
                                  "nowrap"
                              }}
                            >
                              {h}
                            </th>

                          )
                        )}

                      </tr>

                    </thead>


                    <tbody>

                      {selectedRows.map(
                        (r, i) => {

                          const isMatch =
                            matched &&
                            String(
                              r[idColumn]
                            ) ===
                            String(
                              matched[idColumn]
                            );

                          const rowColor = getRowColor(r.__sheetName, r, colorRules, highlightRule);

                          return (

                            <tr
                              key={i}

                              style={{
                                background:
                                  rowColor ||
                                  (isMatch
                                    ? AMBER_BG
                                    : i % 2 === 0
                                      ? PANEL
                                      : PAPER)
                              }}
                            >

                              <td
                                style={{
                                  padding:
                                    "7px 10px",

                                  borderBottom:
                                    `1px solid ${LINE}`,

                                  fontFamily:
                                    "'IBM Plex Mono', monospace",

                                  fontWeight:
                                    isMatch
                                      ? 600
                                      : 400,

                                  whiteSpace:
                                    "nowrap"
                                }}
                              >
                                {
                                  String(
                                    r[idColumn]
                                  )
                                }
                              </td>

                              <td
                                style={{
                                  padding: "7px 10px",
                                  borderBottom: `1px solid ${LINE}`,
                                  color: INK_SOFT,
                                  whiteSpace: "nowrap"
                                }}
                              >
                                {r.__sheetName}
                              </td>


                              {displayColumns.map(
                                (h) => (

                                  <td
                                    key={h}

                                    style={{
                                      padding:
                                        "7px 10px",

                                      borderBottom:
                                        `1px solid ${LINE}`,

                                      color: INK,

                                      whiteSpace:
                                        "nowrap"
                                    }}
                                  >
                                    {
                                      String(
                                        r[h] ?? ""
                                      )
                                    }
                                  </td>

                                )
                              )}

                            </tr>

                          );
                        }
                      )}

                    </tbody>

                  </table>

                </div>

              </Panel>
            )}

          </div>

          {scannerOpen && (
            <div className="scanner-modal-backdrop" role="dialog" aria-modal="true" aria-label="Leitor de QR Code">
              <div className="scanner-modal">
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "14px 16px", borderBottom: `1px solid var(--border)` }}>
                  <strong style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Ler QR Code</strong>
                  <button
                    type="button"
                    onClick={() => setScannerOpen(false)}
                    aria-label="Fechar leitor"
                    style={{ display: "grid", placeItems: "center", width: 40, minHeight: 40, padding: 0, border: `1px solid var(--border)`, borderRadius: 5, background: "transparent", color: "var(--text)", cursor: "pointer" }}
                  >
                    <Icon name="X" size={19} />
                  </button>
                </div>
                <video ref={scannerVideoRef} className="scanner-video" playsInline muted />
                <div className="scanner-status">
                  <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--accent)" }} />
                  {scannerStatus || "Preparando a câmera..."}
                </div>
                <div style={{ padding: "0 16px 16px", color: "var(--muted)", fontSize: 12, lineHeight: 1.5 }}>
                  A leitura será consultada e registrada automaticamente.
                </div>
              </div>
            </div>
          )}

          {deleteBoxCandidate && (
            <div className="modal-backdrop" role="dialog" aria-modal="true" aria-label="Confirmar exclusão de caixa">
              <div className="app-modal" style={{ maxWidth: 460 }}>
                <div style={{ padding: "18px 20px", borderBottom: `1px solid var(--border)` }}>
                  <h2 style={{ fontFamily: "'Space Grotesk', sans-serif", fontSize: 20 }}>Excluir caixa</h2>
                </div>
                <div style={{ padding: 20 }}>
                  <div style={{ padding: 12, borderRadius: 6, background: RED_BG, color: RED, fontWeight: 700 }}>Deseja realmente excluir esta caixa?</div>
                  <div style={{ display: "grid", gap: 7, marginTop: 15, fontSize: 13 }}>
                    <div><strong>Caixa:</strong> CX{deleteBoxCandidate.number} {deleteBoxCandidate.description ? `- ${deleteBoxCandidate.description}` : ""}</div>
                    <div><strong>Materiais:</strong> {deleteBoxCandidate.materials?.length || 0}</div>
                    <div><strong>Localização:</strong> {deleteBoxCandidate.description || "Não informada"}</div>
                    <div><strong>Data de criação:</strong> {deleteBoxCandidate.createdAt}</div>
                  </div>
                  {deleteBoxCandidate.materials?.length ? (
                    <div style={{ marginTop: 16, padding: 12, border: `1px solid ${RED}`, borderRadius: 6, color: RED, fontSize: 13 }}><strong>⚠️ ATENÇÃO</strong><br />Esta caixa possui {deleteBoxCandidate.materials.length} materiais armazenados.<br /><br />Ao excluir, a caixa <strong>e os {deleteBoxCandidate.materials.length} materiais</strong> serão removidos do registro e do estoque. Essa ação não poderá ser desfeita.</div>
                  ) : (
                    <div style={{ marginTop: 16, color: RED, fontSize: 13 }}>Essa ação não poderá ser desfeita.</div>
                  )}
                  <div className="panel-actions" style={{ marginTop: 20 }}>
                    <button type="button" onClick={() => setDeleteBoxCandidate(null)} style={{ minHeight: 42, padding: "9px 14px", border: `1px solid ${LINE_STRONG}`, borderRadius: 5, background: "transparent", color: "var(--text)", cursor: "pointer", fontWeight: 700 }}>CANCELAR</button>
                    <button type="button" onClick={confirmDeleteBox} style={{ minHeight: 42, padding: "9px 14px", border: `1px solid ${RED}`, borderRadius: 5, background: RED, color: "#fff", cursor: "pointer", fontWeight: 700 }}>🗑️ EXCLUIR CAIXA{deleteBoxCandidate.materials?.length ? ` E ${deleteBoxCandidate.materials.length} MATERIAL(IS)` : ""}</button>
                  </div>
                </div>
              </div>
</div>
          )}

        </div>
      );
    }


    /* =========================================================
       INICIAR REACT
    ========================================================= */

    const root =
      ReactDOM.createRoot(
        document.getElementById("root")
      );

    root.render(
      <App />
    );

  </script>

</body>
</html>
